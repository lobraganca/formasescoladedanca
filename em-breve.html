<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>503 · Serviço indisponível</title>
<style>
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#202124}
main{padding:32px 24px;max-width:460px}
.code{font-size:72px;font-weight:700;color:#9aa0a6;margin:0;line-height:1}
h1{font-size:20px;font-weight:600;margin:18px 0 8px}
p{margin:0 0 6px;color:#5f6368;font-size:15px;line-height:1.5}
small{display:block;margin-top:22px;color:#9aa0a6;font-size:12px}
</style>
</head>
<body>
<main>
<p class="code">503</p>
<h1>Serviço indisponível</h1>
<p>Este site está temporariamente fora do ar.</p>
<p>Tente novamente mais tarde.</p>
<small>Erro 503 · Service Unavailable</small>
</main>
</body>
</html>
